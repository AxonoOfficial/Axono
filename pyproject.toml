[build-system]
requires = [
    "scikit-build-core>=0.5",
    "nanobind>=2.0",
    "numpy",
]
build-backend = "scikit_build_core.build"

[project]
name = "axono"
version = "0.2.0"
description = "Deep learning framework with tensor operations and neural network modules"
readme = "README.md"
requires-python = ">=3.8"
license = {file = "LICENSE"}
authors = [
    { name = "ByteRainTech", email = "offical@byterain.co" },
    { name = "aztice", email = "offical@byterain.co" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/ByteRainTech/Axono"
Repository = "https://github.com/ByteRainTech/Axono"
Documentation = "https://axono.readthedocs.io"

[tool.scikit-build]
# 源码布局: 顶层 CMakeLists.txt; Python 包在 axono/python/axono
wheel.packages = ["axono/python/axono"]
cmake.verbose = false
# 编译产物 libaxono*.so 由 CMake install 到包内 (见 axono/CMakeLists.txt)
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
# pip install 时默认 CPU 构建; CUDA 由环境变量 AXONO_WITH_CUDA=1 开启

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "N",    # pep8-naming
]
ignore = [
    "E501",  # line too long, handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["axono"]

[tool.pytest.ini_options]
testpaths = ["axono/python/tests"]
