name: tests

on:
  push:
    branches: [main, dev, "0.*"]
  pull_request:
    branches: [main, dev, "0.*"]
  workflow_dispatch:

jobs:
  cpu:
    name: CPU tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nanobind numpy pytest scikit-build-core

      - name: Configure (CPU)
        run: |
          cmake -B build -DPython_EXECUTABLE=$(which python)

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Locate extension and prepare package
        run: |
          SO=$(find build -name 'libaxono*.so' | head -1)
          echo "Found extension: $SO"
          mkdir -p axono/python/axono/library
          cp "$SO" axono/python/axono/library/

      - name: Run tests
        working-directory: axono/python
        run: |
          python -m pytest tests -v --tb=short

  kaggle-gpu:
    name: CUDA tests (Kaggle)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.12 (For Connection Only)
      uses: actions/setup-python@v3
      with:
        python-version: 3.12
        
    - name: Upload
      id: upload
      run: |
        zip -r artifact.zip ./*
        RESPONSE=$(curl -s -T ./artifact.zip https://bashupload.cloud)
        echo "Raw response: $RESPONSE"
        URL=$(echo "$RESPONSE" | grep -oE 'https://[^ ]+')
        echo "DOWNLOAD_URL=$URL" >> "$GITHUB_ENV"
        echo "download_url=$URL" >> "$GITHUB_OUTPUT"
        
    - name: Generate Script
      run: cat > .github/job.py <<'EOF'
           import os
           DOWNLOAD_URL = "${DOWNLOAD_URL}"
           os.system('conda create -n TestEnv python=3.12 cudatoolkit=12.8 cudnn -y')
           os.system('wget '+DOWNLOAD_URL)
           os.system('unzip ./*.zip')
           os.system('bash install.sh')
           
    - uses: "lvyufeng/action-kaggle-gpu-test@latest"
      name: Build And Run
      with:
        kaggle_username: "${{ secrets.KAGGLE_USERNAME }}"
        kaggle_key: "${{ secrets.KAGGLE_API_KEY }}"
        kernel_name: Cybertron
        kernel_job_file: .github/job.py

  cuda:
    name: CUDA tests (V100-class, cuBLAS)
    # CUDA runner 不可用时跳过, 不阻塞 PR
    if: false
    runs-on: [self-hosted, cuda]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nanobind numpy pytest scikit-build-core

      - name: Configure (CUDA + cuBLAS)
        run: |
          cmake -B build -DWITH_CUDA=ON -DPython_EXECUTABLE=$(which python)

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Locate extension and prepare package
        run: |
          SO=$(find build -name 'libaxono*.so' | head -1)
          mkdir -p axono/python/axono/library
          cp "$SO" axono/python/axono/library/

      - name: Run tests
        working-directory: axono/python
        run: |
          python -m pytest tests -v --tb=short
