name: tests

on:
  push:
    branches: [main, dev, "0.*"]
  pull_request:
    branches: [main, dev, "0.*"]
  workflow_dispatch:

jobs:
  cpu:
    name: CPU tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 直接走 install.sh (自动检测 CUDA; CI 容器无 GPU → CPU 构建),
      # 与用户实际安装路径完全一致
      - name: Build and install via install.sh
        run: bash install.sh --no-cuda

      - name: Run tests (against installed package)
        run: |
          pip install pytest
          # 在仓库外运行, 确保 import 的是 site-packages 里安装的 axono
          # 而不是源码树 (源码树内无编译产物)
          TESTDIR=$(mktemp -d)
          cp -r axono/python/tests "$TESTDIR"/
          cd "$TESTDIR"
          python -m pytest tests -v --tb=short

  cuda:
    name: CUDA tests (V100-class, cuBLAS)
    # CUDA runner 不可用时跳过, 不阻塞 PR
    if: false
    runs-on: [self-hosted, cuda]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nanobind numpy pytest scikit-build-core

      - name: Configure (CUDA + cuBLAS)
        run: |
          cmake -B build -DWITH_CUDA=ON -DPython_EXECUTABLE=$(which python)

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Locate extension and prepare package
        run: |
          SO=$(find build -name 'libaxono*.so' | head -1)
          mkdir -p axono/python/axono/library
          cp "$SO" axono/python/axono/library/

      - name: Run tests
        working-directory: axono/python
        run: |
          python -m pytest tests -v --tb=short
