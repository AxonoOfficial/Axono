name: tests

on:
  push:
    branches: [main, dev, "0.*"]
  pull_request:
    branches: [main, dev, "0.*"]
  workflow_dispatch:

jobs:
  cpu:
    name: CPU tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 直接走 install.sh (自动检测 CUDA; CI 容器无 GPU → CPU 构建),
      # 与用户实际安装路径完全一致
      - name: Build and install via install.sh
        run: bash install.sh --no-cuda

      - name: Run tests (against installed package)
        run: |
          pip install pytest
          # 在仓库外运行, 确保 import 的是 site-packages 里安装的 axono
          # 而不是源码树 (源码树内无编译产物)
          TESTDIR=$(mktemp -d)
          cp -r axono/python/tests "$TESTDIR"/
          cd "$TESTDIR"
          python -m pytest tests -v --tb=short

  windows:
    name: Windows tests (CPU, py${{ matrix.python-version }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 走 install.ps1 (与 Windows 用户实际安装路径一致)
      - name: Build and install via install.ps1
        shell: pwsh
        run: .\install.ps1 -NoCuda

      - name: Run tests (against installed package)
        shell: pwsh
        run: |
          pip install pytest
          $testdir = Join-Path $env:RUNNER_TEMP "axono-tests"
          New-Item -ItemType Directory -Force -Path $testdir | Out-Null
          Copy-Item -Recurse -Force axono/python/tests (Join-Path $testdir "tests")
          Set-Location $testdir
          python -m pytest tests -v --tb=short

  build-wheel:
    # 预演 Release 全矩阵: release.yml 发布的每个组合都在 PR 上构建一遍,
    # 保证发布不会因脚本/依赖变化而挂
    name: Build wheel (${{ matrix.cuda.name }}, py${{ matrix.python-version }})
    # cu118 只在 ubuntu2204 repo 提供 (2404 上依赖冲突), runner 相应切换
    runs-on: ${{ matrix.os == 'windows-2022' && 'windows-2022' || (matrix.cuda.name == 'cu118' && 'ubuntu-22.04' || 'ubuntu-24.04') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        python-version: ["3.10", "3.13"]
        cuda:
          - { name: cpu,   tag: "",     pkg: "",      repo: "",        local: "" }
          - { name: cu118, tag: cu118,  pkg: "11-8",  repo: ubuntu2204, local: "11.8.0" }
          - { name: cu126, tag: cu126,  pkg: "12-6",  repo: ubuntu2404, local: "12.6.3" }
          - { name: cu128, tag: cu128,  pkg: "12-8",  repo: ubuntu2404, local: "12.8.1" }
          - { name: cu130, tag: cu130,  pkg: "13-0",  repo: ubuntu2404, local: "13.0.1" }
        exclude:
          # nvcc 11.8 需旧 MSVC 工具集, 但 CPython 3.13 扩展构建要求
          # 新 toolset (MSB8052) — Windows cu118 只提供 py3.10 wheel
          - { os: windows-2022, cuda: { name: cu118 }, python-version: "3.13" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up CUDA toolchain ${{ matrix.cuda.name }} (Linux)
        if: runner.os == 'Linux' && matrix.cuda.name != 'cpu'
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/${{ matrix.cuda.repo }}/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          (sudo apt-get install -y -qq cuda-nvcc-${{ matrix.cuda.pkg }} \
             cuda-cudart-dev-${{ matrix.cuda.pkg }} libcublas-dev-${{ matrix.cuda.pkg }} \
             cuda-curand-dev-${{ matrix.cuda.pkg }} \
             || sudo apt-get install -y -qq --no-install-recommends \
                cuda-toolkit-${{ matrix.cuda.pkg }})
          NVCC=$(find /usr/local/cuda-*/bin -name nvcc 2>/dev/null | head -1)
          echo "$(dirname "$NVCC")" >> "$GITHUB_PATH"

      - name: Set up CUDA toolchain ${{ matrix.cuda.name }} (Windows)
        if: runner.os == 'Windows' && matrix.cuda.name != 'cpu'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.cuda.local }}
          method: local
          # 全量 toolkit: Windows installer 子包名与 Linux 不同,
          # 指定 cublas/curand 子包会静默失败 (lib 未装上), 全装最稳
          log-file-suffix: '${{ matrix.cuda.name }}-py${{ matrix.python-version }}.txt'

      - name: Pin MSVC 14.40 for CUDA 11.8 (Windows)
        # nvcc 11.8 不兼容最新 MSVC 19.44 (STL 要求 CUDA 12.4+), 用旧版工具集
        if: runner.os == 'Windows' && matrix.cuda.name == 'cu118'
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          (Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Sort-Object Name) | ForEach-Object { $_.Name }
          $v = (Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Where-Object { $_.Name -like '14.29*' -or $_.Name -like '14.40*' } | Sort-Object Name -Descending | Select-Object -First 1).Name
          if (-not $v) { throw "MSVC 14.29/14.40 not installed on runner" }
          "VCToolsVersion=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Pinned VCToolsVersion=$v"

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install --upgrade pip
          pip install nanobind numpy scikit-build-core build

      - name: Install build deps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install nanobind numpy scikit-build-core build

      - name: Build wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.cuda.name }}" = "cpu" ]; then
            bash wheel.sh --no-cuda --outdir "dist/${{ matrix.cuda.name }}"
          else
            AXONO_CUDA_TAG=${{ matrix.cuda.tag }} \
              bash wheel.sh --cuda --ignore-drivers --no-build-isolation \
              --outdir "dist/${{ matrix.cuda.name }}"
          fi
        env:
          PIP: python -m pip

      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.cuda.name }}" -eq "cpu") {
            .\wheel.ps1 -NoCuda -OutDir "dist/cpu"
          } else {
            .\wheel.ps1 -Cuda -IgnoreDrivers -CudaTag "${{ matrix.cuda.tag }}" -OutDir "dist/${{ matrix.cuda.name }}"
          }

      - name: Smoke test (CPU wheels only)
        if: matrix.cuda.name == 'cpu'
        shell: pwsh
        run: |
          pip install (Get-Item dist/cpu/axono-*.whl).FullName
          python -c "import axono; print('import OK', axono.__version__)"

  cuda:
    name: CUDA tests (V100-class, cuBLAS)
    # CUDA runner 不可用时跳过, 不阻塞 PR
    if: false
    runs-on: [self-hosted, cuda]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nanobind numpy pytest scikit-build-core

      - name: Configure (CUDA + cuBLAS)
        run: |
          cmake -B build -DWITH_CUDA=ON -DPython_EXECUTABLE=$(which python)

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Locate extension and prepare package
        run: |
          SO=$(find build -name 'libaxono*.so' | head -1)
          mkdir -p axono/python/axono/library
          cp "$SO" axono/python/axono/library/

      - name: Run tests
        working-directory: axono/python
        run: |
          python -m pytest tests -v --tb=short
