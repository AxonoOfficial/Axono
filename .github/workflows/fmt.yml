name: Code Format and Commit

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message for the formatting changes'
        required: true
        default: 'Format code'
      branch:
        description: 'Target branch'
        required: true
        default: 'dev'

jobs:
  format:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ${{ inputs.branch }}
      COMMIT_MESSAGE: ${{ inputs.commit_message }}

    steps:
    - name: Validate target branch
      run: git check-ref-format "refs/heads/$TARGET_BRANCH"

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        ref: refs/heads/${{ inputs.branch }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: python -m pip install -r tools/requirements-style.txt

    - name: Format Python code with ruff
      run: |
        ruff check --fix .
        ruff format .

    - name: Check Python lint and formatting
      run: |
        ruff check .
        ruff format --check .

    - name: Format C++ code with clang-format
      run: |
        git ls-files -z -- '*.cpp' '*.hpp' '*.h' '*.cc' '*.cxx' '*.hxx' | xargs -0 -r clang-format -i

    - name: Check if there are changes
      id: check-changes
      run: |
        if git diff --quiet; then
          echo "No changes detected"
          echo "has_changes=false" >> "$GITHUB_OUTPUT"
        else
          echo "Changes detected"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Commit and push changes
      if: steps.check-changes.outputs.has_changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add --update
        git commit -m "$COMMIT_MESSAGE"
        git push origin "HEAD:refs/heads/$TARGET_BRANCH"
