name: Release Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号覆盖 (默认读 pyproject.toml)'
        required: false

permissions:
  contents: write

env:
  # CUDA 版本 → (apt 包后缀, apt 仓库, 文件名 tag)。
  # 11.8 只在 ubuntu2204 repo 提供; 12.6+ 在 ubuntu2404。
  CUDA_VERSIONS: "11.8 12.6 12.8 13.0"

jobs:
  build-linux:
    name: Linux wheel (${{ matrix.cuda.name }}, py${{ matrix.python-version }})
    # cu118 只在 ubuntu2204 repo 提供 (2404 上依赖冲突), runner 相应切换
    runs-on: ${{ matrix.cuda.name == 'cu118' && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        cuda:
          - { name: cpu,   tag: "",     pkg: "",      repo: "" }
          - { name: cu118, tag: cu118,  pkg: "11-8",  repo: ubuntu2204 }
          - { name: cu126, tag: cu126,  pkg: "12-6",  repo: ubuntu2404 }
          - { name: cu128, tag: cu128,  pkg: "12-8",  repo: ubuntu2404 }
          - { name: cu130, tag: cu130,  pkg: "13-0",  repo: ubuntu2404 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up CUDA toolchain ${{ matrix.cuda.name }}
        if: matrix.cuda.name != 'cpu'
        run: |
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/${{ matrix.cuda.repo }}/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update -qq
          (sudo apt-get install -y -qq cuda-nvcc-${{ matrix.cuda.pkg }} \
             cuda-cudart-dev-${{ matrix.cuda.pkg }} libcublas-dev-${{ matrix.cuda.pkg }} \
             cuda-curand-dev-${{ matrix.cuda.pkg }} \
             || sudo apt-get install -y -qq --no-install-recommends \
                cuda-toolkit-${{ matrix.cuda.pkg }})
          echo "/usr/local/cuda-${{ matrix.cuda.pkg }}*/bin" > /dev/null
          NVCC=$(find /usr/local/cuda-*/bin -name nvcc 2>/dev/null | head -1)
          echo "$(dirname "$NVCC")" >> "$GITHUB_PATH"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install nanobind numpy scikit-build-core build

      - name: Build wheel
        run: |
          if [ "${{ matrix.cuda.name }}" = "cpu" ]; then
            bash wheel.sh --no-cuda --outdir "dist/${{ matrix.cuda.name }}"
          else
            AXONO_CUDA_TAG=${{ matrix.cuda.tag }} \
              bash wheel.sh --cuda --ignore-drivers --no-build-isolation \
              --outdir "dist/${{ matrix.cuda.name }}"
          fi
        env:
          PIP: python -m pip

      - name: Smoke test (CPU wheels only; CUDA wheel 需 GPU 运行时)
        if: matrix.cuda.name == 'cpu'
        run: |
          pip install dist/cpu/axono-*.whl
          python -c "import axono; print('import OK', axono.__version__)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.cuda.name }}-py${{ matrix.python-version }}
          path: dist/${{ matrix.cuda.name }}/axono-*.whl

  build-windows:
    name: Windows wheel (${{ matrix.cuda.name }}, py${{ matrix.python-version }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        cuda:
          - { name: cpu,   tag: "",     local: "" }
          - { name: cu118, tag: cu118,  local: "11.8.0" }
          - { name: cu126, tag: cu126,  local: "12.6.3" }
          - { name: cu128, tag: cu128,  local: "12.8.1" }
          - { name: cu130, tag: cu130,  local: "13.0.1" }
        exclude:
          # nvcc 11.8 与现 runner 工具链不兼容 (MSB8052), Windows 不出 cu118
          - { cuda: { name: cu118 } }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # hosted runner 无 GPU; -IgnoreDrivers 只查 nvcc (编译不需 GPU,
      # 运行 wheel 的机器才需要驱动)
      - name: Set up CUDA toolchain ${{ matrix.cuda.name }}
        if: matrix.cuda.name != 'cpu'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: ${{ matrix.cuda.local }}
          method: local
          # 全量 toolkit: Windows installer 子包名与 Linux 不同,
          # 指定 cublas/curand 子包会静默失败 (lib 未装上), 全装最稳
          log-file-suffix: '${{ matrix.cuda.name }}-py${{ matrix.python-version }}.txt'

      - name: Install build deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install nanobind numpy scikit-build-core build

      - name: Build wheel
        shell: pwsh
        run: |
          if ("${{ matrix.cuda.name }}" -eq "cpu") {
            .\wheel.ps1 -NoCuda -OutDir "dist/cpu"
          } else {
            .\wheel.ps1 -Cuda -IgnoreDrivers -CudaTag "${{ matrix.cuda.tag }}" -OutDir "dist/${{ matrix.cuda.name }}"
          }

      - name: Smoke test (CPU wheels only; CUDA wheel 需 GPU 运行时)
        if: matrix.cuda.name == 'cpu'
        shell: pwsh
        run: |
          pip install (Get-Item dist/cpu/axono-*.whl).FullName
          python -c "import axono; print('import OK', axono.__version__)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-win-${{ matrix.cuda.name }}-py${{ matrix.python-version }}
          path: dist/${{ matrix.cuda.name }}/axono-*.whl

  publish:
    name: Publish to GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: wheels
          pattern: wheel-*

      - name: List wheels
        run: find wheels -name 'axono-*.whl' | sort

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手动触发: 取最新 release
            RELEASE_TAG=$(gh release list -R "$GITHUB_REPOSITORY" --limit 1 --json tagName -q '.[0].tagName')
          fi
          for f in wheels/*/axono-*.whl; do
            gh release upload "$RELEASE_TAG" "$f" -R "$GITHUB_REPOSITORY" --clobber
          done
          echo "uploaded to release $RELEASE_TAG"
