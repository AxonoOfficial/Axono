name: Code-Style Check

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-check:
    if: "${{ !contains(github.event.pull_request.labels.*.name, 'skip: code-style check') }}"
    name: Code-Style Check
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install style tools
      run: python -m pip install -r tools/requirements-style.txt

    - name: Check Python lint
      run: ruff check .
    
    - name: Check Python formatting
      run: ruff format --check .
    
    - name: Check C++ formatting
      run: |
        git ls-files -z '*.cpp' '*.hpp' '*.h' '*.cc' '*.cxx' '*.hxx' |
          xargs -0 -r clang-format --dry-run --Werror
