name: Coverage Test (Python)

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  coverage:
    name: Coverage Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov

    - name: Build and install via install.sh
      run: bash install.sh --no-cuda

    - name: Run Coverage Test
      run: |
        # 仓库外运行: 统计 site-packages 中安装的 axono
        TESTDIR=$(mktemp -d)
        cp -r axono/python/tests "$TESTDIR"/
        cd "$TESTDIR"
        SITE=$(python -c "import axono, os; print(os.path.dirname(os.path.dirname(axono.__file__)))")
        python -m pytest tests --cov="$SITE/axono" --cov-branch --cov-report=xml --cov-report=term

    - name: Upload Coverage Report
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: ByteRainTech/Axono
