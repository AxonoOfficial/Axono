name: Coverage Test (Python)

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  coverage:
    name: Coverage Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nanobind numpy pytest pytest-cov scikit-build-core

    - name: Configure (CPU)
      run: |
        cmake -B build -DPython_EXECUTABLE=$(which python)

    - name: Build
      run: cmake --build build -j"$(nproc)"

    - name: Locate extension and prepare package
      run: |
        SO=$(find build -name 'libaxono*.so' | head -1)
        echo "Found extension: $SO"
        mkdir -p axono/python/axono/library
        cp "$SO" axono/python/axono/library/

    - name: Run Coverage Test
      working-directory: axono/python
      run: |
        PYTHONPATH=. python -m pytest tests --cov=axono --cov-branch --cov-report=xml --cov-report=term

    - name: Upload Coverage Report
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: ByteRainTech/Axono
